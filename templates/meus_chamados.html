<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Meus Chamados</title>
</head>
<body>
  <h1>Meus Chamados</h1>

  {% if chamados %}
    <ul>
      {% for chamado in chamados %}
        <li>
          <strong>Categoria:</strong> {{ chamado.categoria }}<br />
          <strong>Anexo:</strong> {{ chamado.anexo or 'Nenhum' }}<br />
          <strong>Mensagem:</strong> {{ chamado.mensagem }}<br />
          <hr>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>Você ainda não enviou nenhum chamado.</p>
  {% endif %}

  <a href="{{ url_for('pagina_principal') }}">Voltar</a>
</body>
</html>
